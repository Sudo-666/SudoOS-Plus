[package]
name = "arch-riscv64"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
myos-boot = { path = "../../boot"}

myos-mm = { path = "../../mm"}

[features]
# 平台必须显式选择:不允许默认平台(见 platform/mod.rs 的 compile_error! 守卫)。
# 构建脚本(build.sh / Makefile)按 ARCH+PLATFORM 传入恰好一个平台 feature。
platform-qemu-virt = []
platform-visionfive2 = []

[lints]
workspace = true