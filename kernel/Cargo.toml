[package]
name = "myos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "myos-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# 默认开启物理开发板特性
default = ["platform-ls2k1000"]
# 将外层的特性透传给 arch 依赖。架构 crate 均以 default-features=false
# 引入,平台 feature 完全由本层显式透传,杜绝隐式默认平台。
platform-qemu-virt = [
    "arch-loongarch64/platform-qemu-virt",
    "arch-riscv64/platform-qemu-virt",
]
platform-ls2k1000 = ["arch-loongarch64/platform-ls2k1000"]
platform-visionfive2 = ["arch-riscv64/platform-visionfive2"]
# 诊断构建专用：启用共享 trap body 的 breakpoint 自测等上板自检。
# 稳定构建不开启（默认行为），仅排障时显式 --features boot-selftest 使用。
boot-selftest = []

[dependencies]
myos-boot = { path = "../boot"}
myos-runtime = { path = "../runtime"}
myos-fdt = { path = "../firmware/fdt"}
myos-mm = { path = "../mm"}
myos-sync = { path = "../sync"}
myos-vfs = { path = "../vfs"}
virtio-drivers = { path = "../vendor/virtio-drivers", default-features = false, features = ["alloc"]}
smoltcp = { version = "0.11", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-raw"]}
# 定长字符串，供 heap 安装前的 bootargs 解析使用（BOOT06 之前的
# config_from_bootargs 不依赖堆）。已 vendored（smoltcp 依赖同一 crate）。
heapless = { version = "0.8", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
arch-riscv64 = { path = "../arch/riscv64", default-features = false }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
arch-loongarch64 = { path = "../arch/loongarch64", default-features = false }

[lints]
workspace = true