[package]
name = "myos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "myos-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# 默认开启物理开发板特性
default = ["platform-ls2k1000"]
# 将外层的特性透传给 arch 依赖 (riscv64 默认平台由 arch-riscv64 自带)
platform-qemu-virt = [
    "arch-loongarch64/platform-qemu-virt",
    "arch-riscv64/platform-qemu-virt",
]
platform-ls2k1000 = ["arch-loongarch64/platform-ls2k1000"]
platform-visionfive2 = ["arch-riscv64/platform-visionfive2"]

[dependencies]
myos-boot = { path = "../boot"}
myos-runtime = { path = "../runtime"}
myos-fdt = { path = "../firmware/fdt"}
myos-mm = { path = "../mm"}
myos-sync = { path = "../sync"}
myos-vfs = { path = "../vfs"}
virtio-drivers = { path = "../vendor/virtio-drivers", default-features = false, features = ["alloc"]}
smoltcp = { version = "0.11", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-raw"]}

[target.'cfg(target_arch = "riscv64")'.dependencies]
arch-riscv64 = { path = "../arch/riscv64"}

[target.'cfg(target_arch = "loongarch64")'.dependencies]
arch-loongarch64 = { path = "../arch/loongarch64"}

[lints]
workspace = true